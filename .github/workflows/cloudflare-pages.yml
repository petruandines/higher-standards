name: Publish Higher Standards to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: higher-standards-cloudflare-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'petruandines/higher-standards' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned publishing tool without credentials
        run: npm install --prefix "$RUNNER_TEMP/higher-standards-tools" --no-save --ignore-scripts --no-audit --no-fund wrangler@4.45.0
      - name: Build public assets and check local links
        run: node scripts/build-pages.mjs
      - name: Check isolated target and capture main-site baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-pages.mjs prepare
      - name: Publish Higher Standards only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node "$RUNNER_TEMP/higher-standards-tools/node_modules/wrangler/bin/wrangler.js" pages deploy dist-pages --project-name petruandines-higher-standards --branch main --commit-dirty=true
      - name: Attach Higher Standards subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-pages.mjs domain
      - name: Verify HTTPS, assets and unchanged main site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-pages.mjs verify
