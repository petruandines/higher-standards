name: Verify published responsive layout
on:
  workflow_run:
    workflows: [Publish Higher Standards to Cloudflare Pages]
    types: [completed]
permissions:
  contents: read
jobs:
  responsive:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.repository == 'petruandines/higher-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/higher-standards-qa" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/higher-standards-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test live layout and interactions
        env:
          QA_TOOLS: ${{ runner.temp }}/higher-standards-qa
        run: node scripts/responsive-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: higher-standards-responsive-qa
          path: qa-results
          retention-days: 7
